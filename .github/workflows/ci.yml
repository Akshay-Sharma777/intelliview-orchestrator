name: CI

on:
  push:
    branches: [main, Stabilized-version]

  pull_request:
    branches: [main, Stabilized-version]

permissions:
  contents: read

jobs:

  # --------------------------------------------------
  # Python tests
  # --------------------------------------------------

  test:
    name: Python Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ai_interview_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ai_interview_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DATABASE_SSLMODE: disable
      API_TOKEN: ci-test-token
      JSON_LOGGING: "0"
      ENABLE_PROMETHEUS: "true"
      CORS_ALLOW_ORIGINS: "*"
      RATE_LIMIT_PER_MINUTE: "10000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black isort

      - name: Black format check
        run: black --check .

      - name: isort import check
        run: isort --check-only --profile black .

      - name: Ruff lint
        run: ruff check orchestrator workers monitoring database tests scripts routers retrieval

      - name: Run DB migrations
        run: alembic upgrade head

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --ignore=tests/test_e2e_smoke.py \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-fail-under=50 \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: htmlcov/

  # --------------------------------------------------
  # End-to-end tests
  # --------------------------------------------------

  e2e:
    name: End-to-End Smoke Test
    needs: test
    runs-on: ubuntu-latest

    env:
      API_TOKEN: ci-test-token
      API_BASE_URL: http://localhost:8000
      # Inside the docker-compose network,
